# k3stui CI — 설계: docs/CI-DESIGN.md
#   check        gofmt·go vet·단위 테스트 (1회)
#   build        Ubuntu 22.04·24.04·26.04, RHEL 8·9·10(UBI)에서 각각 빌드·테스트·패키징
#   install-test 깨끗한 배포판 컨테이너에 패키지를 설치해 실행·설정 보존·제거 확인
#   e2e-k3s      러너에 K3s를 설치해 통합 테스트 (main 푸시·태그·수동 실행)
#   e2e-kubeadm  kind(kubeadm) 노드 안에서 Host 기능 판별 확인 (main 푸시·태그·수동 실행)
#   e2e-rke2     systemd 컨테이너에 RKE2를 설치해 확인 (수동 실행에서 선택했을 때만)
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:
    inputs:
      e2e:
        description: K3s·kubeadm 통합 테스트 실행
        type: boolean
        default: true
      rke2:
        description: RKE2 통합 테스트 실행 (5분 이상 걸립니다)
        type: boolean
        default: false
  workflow_call: # release.yml에서 같은 빌드를 재사용합니다
    inputs:
      e2e:
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  GOFLAGS: -buildvcs=false

jobs:
  check:
    name: check (gofmt · vet · test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - name: gofmt
        working-directory: src
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt가 필요한 파일:"; echo "$out"; exit 1; fi
      - name: go vet
        working-directory: src
        run: |
          go vet ./...
          go vet -tags e2e ./...
      - name: go test
        working-directory: src
        run: go test ./...

  build:
    name: build (${{ matrix.id }})
    needs: check
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false # 한 배포판이 실패해도 나머지 결과를 봅니다
      matrix:
        include:
          - { id: ubuntu-22.04, runner: ubuntu-22.04, image: "",                                       format: --deb }
          - { id: ubuntu-24.04, runner: ubuntu-24.04, image: "",                                       format: --deb }
          - { id: ubuntu-26.04, runner: ubuntu-24.04, image: "ubuntu:26.04",                           format: --deb }
          - { id: rhel-8,       runner: ubuntu-24.04, image: "registry.access.redhat.com/ubi8/ubi",   format: --rpm el8 }
          - { id: rhel-9,       runner: ubuntu-24.04, image: "registry.access.redhat.com/ubi9/ubi",   format: --rpm el9 }
          - { id: rhel-10,      runner: ubuntu-24.04, image: "registry.access.redhat.com/ubi10/ubi",  format: --rpm el10 }
    steps:
      # 컨테이너에는 checkout·setup-go에 필요한 git·tar가 없습니다
      - name: 기본 도구 설치 (Ubuntu 컨테이너)
        if: matrix.image != '' && startsWith(matrix.id, 'ubuntu')
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git ca-certificates curl tar gzip
      - name: 기본 도구 설치 (RHEL UBI 컨테이너)
        if: startsWith(matrix.id, 'rhel')
        run: dnf install -y -q git tar gzip
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git describe로 버전을 정하므로 태그 이력이 필요합니다
      - name: git safe.directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - name: 빌드·테스트 (${{ matrix.id }})
        run: bin/build.sh --test
      - name: 패키징 (amd64·arm64)
        run: |
          fmt="${{ matrix.format }}"
          # 압축본은 배포판과 무관하므로 ubuntu-24.04에서만 만듭니다
          if [ "${{ matrix.id }}" = ubuntu-24.04 ]; then fmt="--tar $fmt"; fi
          bin/package.sh $fmt --out dist
          echo "VERSION=$(git describe --tags --always --dirty)" >> "$GITHUB_ENV"
      - name: 버전·검증 스크립트 기록
        run: |
          echo "$VERSION" > dist/VERSION
          cp packaging/test-install.sh dist/  # install-test는 checkout 없이 산출물만 받습니다
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.id }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  install-test:
    name: install-test (${{ matrix.id }})
    needs: build
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: ubuntu-22.04, image: "ubuntu:22.04" }
          - { id: ubuntu-24.04, image: "ubuntu:24.04" }
          - { id: ubuntu-26.04, image: "ubuntu:26.04" }
          - { id: rhel-8,       image: "registry.access.redhat.com/ubi8/ubi" }
          - { id: rhel-9,       image: "registry.access.redhat.com/ubi9/ubi" }
          - { id: rhel-10,      image: "registry.access.redhat.com/ubi10/ubi" }
    steps:
      # 빌드 도구(git·tar 포함)가 없는 깨끗한 컨테이너에서 설치합니다. checkout 없이 산출물만 받습니다.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ matrix.id }}
          path: dist
      - name: 설치 검증
        run: bash dist/test-install.sh dist "$(cat dist/VERSION)"

  e2e-k3s:
    name: e2e (K3s)
    needs: build
    if: github.event_name == 'push' || inputs.e2e
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-ubuntu-24.04
          path: dist
      - name: K3s 설치
        run: |
          curl -sfL https://get.k3s.io | sudo INSTALL_K3S_EXEC="--disable=traefik" sh -
          # API 서버가 응답한 뒤에도 노드 등록까지 몇 초가 걸리므로, 노드가 생길 때까지 기다린 다음 Ready를 기다립니다
          for i in $(seq 1 60); do
            [ -n "$(sudo k3s kubectl get nodes -o name 2>/dev/null)" ] && break
            sleep 5
          done
          sudo k3s kubectl wait --for=condition=Ready node --all --timeout=180s
      - name: 통합 테스트 (go test -tags e2e)
        working-directory: src
        run: |
          go test -c -tags e2e -o ../build/kube-e2e.test ./internal/kube/
          sudo K3STUI_E2E_KUBECONFIG=/etc/rancher/k3s/k3s.yaml ../build/kube-e2e.test -test.run E2E -test.v
      - name: 패키지 설치와 Host 기능 확인
        run: |
          sudo dpkg -i dist/k3stui_*_amd64.deb
          out="$(sudo k3stui --check)"
          echo "$out"
          echo "$out" | grep -q "배포판          K3S (API 서버: 로컬)"
          echo "$out" | grep -q "호스트 관리     K3S"
          echo "$out" | grep -q "k3s.service active/running"
          for s in service nodeconfig manifests certs backups containers images; do
            echo "── --dump $s"; sudo k3stui --dump "$s" | head -5
          done

  e2e-kubeadm:
    name: e2e (kubeadm · kind)
    needs: build
    if: github.event_name == 'push' || inputs.e2e
    runs-on: ubuntu-24.04
    env:
      KIND_VERSION: v0.33.0
      NODE: k3stui-control-plane
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-ubuntu-24.04
          path: dist
      - name: kind 클러스터 생성
        run: |
          curl -sSfLo kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          chmod +x kind
          ./kind create cluster --name k3stui --wait 180s
      - name: 노드 안에서 Host 기능 확인
        run: |
          tar -xzf dist/k3stui-*-linux-amd64.tar.gz
          dir="$(ls -d k3stui-*-linux-amd64)"
          docker cp "$dir" "$NODE:/opt/k3stui"
          out="$(docker exec "$NODE" /opt/k3stui/libexec/k3stui --config /opt/k3stui/conf/k3stui.yaml --check)"
          echo "$out"
          echo "$out" | grep -q "배포판          kubeadm (API 서버: 로컬)"
          echo "$out" | grep -q "호스트 관리     kubeadm"
          echo "$out" | grep -q "kubelet.service active/running"
          echo "$out" | grep -q "데이터스토어    etcd"
          for s in service nodeconfig manifests certs containers; do
            echo "── --dump $s"; docker exec "$NODE" /opt/k3stui/libexec/k3stui --config /opt/k3stui/conf/k3stui.yaml --dump "$s" | head -5
          done

  e2e-rke2:
    name: e2e (RKE2)
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.rke2
    runs-on: ubuntu-24.04
    env:
      NODE: k3stui-rke2
      NODE_IMAGE: kindest/node:v1.35.0 # cgroup을 분리한 채 systemd를 띄울 수 있는 이미지
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-ubuntu-24.04
          path: dist
      - name: systemd 컨테이너에 RKE2 설치
        run: |
          docker run -d --name "$NODE" --hostname rke2-node --privileged --cgroupns=private \
            --tmpfs /run --tmpfs /tmp -v /lib/modules:/lib/modules:ro \
            --security-opt seccomp=unconfined --security-opt apparmor=unconfined -e container=docker "$NODE_IMAGE"
          sleep 10
          docker exec "$NODE" bash -c 'systemctl disable --now kubelet containerd'
          docker exec "$NODE" bash -c 'curl -sfL https://get.rke2.io | INSTALL_RKE2_METHOD=tar sh -'
          docker exec "$NODE" bash -c 'systemctl enable rke2-server && systemctl start rke2-server --no-block'
          for i in $(seq 1 60); do
            docker exec "$NODE" bash -c '/var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml get --raw /readyz' 2>/dev/null | grep -q ok && break
            sleep 10
          done
      - name: 노드 안에서 Host 기능 확인
        run: |
          tar -xzf dist/k3stui-*-linux-amd64.tar.gz
          dir="$(ls -d k3stui-*-linux-amd64)"
          docker cp "$dir" "$NODE:/opt/k3stui"
          out="$(docker exec "$NODE" /opt/k3stui/libexec/k3stui --config /opt/k3stui/conf/k3stui.yaml --check)"
          echo "$out"
          echo "$out" | grep -q "배포판          RKE2 (API 서버: 로컬)"
          echo "$out" | grep -q "rke2-server.service active/running"
          echo "$out" | grep -q "kubectl         /var/lib/rancher/rke2/bin/kubectl"
