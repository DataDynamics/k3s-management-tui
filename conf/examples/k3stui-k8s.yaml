# k3stui 설정 예제 — 일반 Kubernetes 클러스터용
#
# K3S가 아닌 클러스터(kubeadm, RKE2, EKS, GKE, AKS, kind 등)를 리소스 관리 도구로 쓸 때의 설정입니다.
# 이 모드에서는 Host 탭(서비스 제어·config.yaml·데이터스토어 백업 등)이 없으므로 k3s·backup 항목은 적지 않습니다.
#
# 사용 방법 (둘 중 하나):
#   1) 직접 지정:      k3stui --config conf/examples/k3stui-k8s.yaml
#   2) 사용자 설정으로: mkdir -p ~/.config/k3stui && cp conf/examples/k3stui-k8s.yaml ~/.config/k3stui/k3stui.yaml
#                      (이후 그냥 k3stui로 실행하면 이 파일을 먼저 찾습니다)
#
# keybindings.yaml, theme.yaml, views.d/는 이 설정 파일과 같은 디렉터리에서 찾습니다
# (1번 방법이면 conf/examples/, 2번 방법이면 ~/.config/k3stui/). 없으면 내장 기본값을 씁니다.
# 컬럼 재정의가 필요하면 conf/views.d/의 예제를 그 디렉터리의 views.d/로 복사하세요.
# 이 파일에 적지 않은 항목도 모두 내장 기본값을 씁니다.

cluster:
  # 배포판: auto | k3s | rke2 | kubeadm | eks | gke | kubernetes
  #   auto는 API 서버 버전(+k3s, +rke2, -eks-, -gke.)과 kube-system/kubeadm-config ConfigMap으로 판별합니다.
  #   배포판 이름은 헤더·대시보드 표시와 기능 판단에 씁니다. 판별이 틀릴 때만 직접 지정하세요.
  distribution: auto

  # kubeconfig 경로입니다. ':'로 여러 파일을 이을 수 있습니다 (KUBECONFIG 형식).
  #   비우면 --kubeconfig → $KUBECONFIG → ~/.kube/config → K3S·RKE2·kubeadm 기본 경로 순서로 찾습니다.
  #   '~'는 펼쳐지지 않으므로 절대 경로로 적으세요.
  kubeconfig: ""

  # 사용할 context 이름입니다. 비우면 kubeconfig의 current-context를 씁니다.
  #   --context 옵션이 이 값보다 우선합니다. kubectl(--context)과 helm(--kube-context)에도 같은 값이 전달됩니다.
  #   예: prod-cluster, arn:aws:eks:ap-northeast-2:123456789012:cluster/prod, gke_my-project_asia-northeast3_prod
  context: ""

  # Host 탭 사용 여부: auto | enabled | disabled
  #   원격 클러스터에서는 노드의 서비스·파일에 접근할 수 없으므로 disabled를 권장합니다.
  #   (auto여도 K3S가 아니거나 API 서버가 원격이면 자동으로 꺼집니다)
  host_management: disabled

ui:
  refresh_interval: 3s              # 메트릭·AGE 갱신 주기. 원격 클러스터는 지연을 고려해 조금 길게 잡습니다 (최소 500ms)
  default_namespace: all            # 시작 네임스페이스 (all = 전체). 큰 클러스터라면 자주 보는 네임스페이스를 지정하세요
  default_view: dashboard           # 시작 탭: dashboard | workloads | network | storage | config | helm
  theme: dark                       # dark | light (색상은 theme.yaml)
  log_tail_lines: 300               # 로그 화면을 열 때 처음 가져올 줄 수
  max_log_lines: 20000              # 로그 화면에 보관할 최대 줄 수 (넘으면 오래된 줄부터 버립니다, 최소 1000)

safety:
  # true면 모든 변경 작업(삭제·편집·스케일·셸 등)을 막습니다. 운영 클러스터라면 true를 권장합니다.
  # --read-only 옵션은 켜기만 할 수 있으므로, 변경이 필요할 때는 read_only: false인 설정 파일을 --config로 지정하세요.
  read_only: false
  confirm_destructive: true         # 삭제·재시작·drain 전에 y/N 확인 (false면 보호 네임스페이스 외에는 바로 실행)
  # 이 네임스페이스의 리소스를 변경할 때는 리소스 이름을 다시 입력해야 합니다.
  # 클러스터에서 쓰는 시스템 네임스페이스를 추가하세요.
  protected_namespaces:
    - kube-system
    - kube-public
    - kube-node-lease
    # - ingress-nginx
    # - cert-manager
    # - monitoring
    # - istio-system

portforward:
  address: 127.0.0.1                # 포트포워딩 바인딩 주소. 0.0.0.0이면 다른 호스트에서도 접근할 수 있으니 주의하세요

tools:
  kubectl: ""                       # 비우면 PATH의 kubectl. 특정 버전을 쓰려면 경로를 적습니다 (예: /usr/local/bin/kubectl-1.31)
  helm: helm                        # Helm 탭에서 쓰는 helm 경로
  editor: ""                        # 비우면 $EDITOR → $VISUAL → vi
  timeout: 30s                      # 외부 명령(kubectl describe, helm 등) 타임아웃. 원격 클러스터가 느리면 늘리세요

logging:
  # 쓸 수 없는 경로면 자동으로 ~/.local/state/k3stui/ 아래로 바꿉니다 (root가 아닌 사용자 실행 시).
  file: /var/log/k3stui/k3stui.log
  level: info                       # debug | info | warn | error

audit:
  # 변경 작업 기록 (JSON Lines). 쓸 수 없으면 ~/.local/state/k3stui/audit.log로 바꿉니다.
  file: /var/log/k3stui/audit.log
