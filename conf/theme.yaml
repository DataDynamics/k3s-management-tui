# 색상 테마. k3stui.yaml의 ui.theme으로 dark/light 중 하나를 고릅니다.
# 값은 "#rrggbb" 또는 ANSI 256 색 번호("39")입니다. 적지 않은 항목은 내장값을 씁니다.

dark:
  fg: "#d0d4dc"
  muted: "#7a8290"
  primary: "#5fafff"      # 활성 탭, 표 머리글, 다이얼로그 테두리
  accent: "#ffaf5f"       # 키 안내, 필터, 검색 강조
  border: "#4a5060"
  selected_fg: "#0f1115"
  selected_bg: "#5fafff"
  header_fg: "#e8ecf2"
  header_bg: "#263040"
  ok: "#5fd787"
  warn: "#ffd75f"
  err: "#ff5f5f"
  info: "#87d7ff"

light:
  fg: "#1f2328"
  muted: "#6e7781"
  primary: "#0969da"
  accent: "#bc4c00"
  border: "#c4cad1"
  selected_fg: "#ffffff"
  selected_bg: "#0969da"
  header_fg: "#ffffff"
  header_bg: "#24292f"
  ok: "#1a7f37"
  warn: "#9a6700"
  err: "#cf222e"
  info: "#0550ae"
